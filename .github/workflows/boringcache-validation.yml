name: BoringCache large-output validation
on:
  push:
    branches: [boringcache-validation]
    paths:
      - .boringcache.toml
      - .github/boringcache-build.sh
      - .github/workflows/boringcache-validation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nx-large-output-validation
  cancel-in-progress: false
env:
  NX_DAEMON: 'false'
  NX_ISOLATE_PLUGINS: 'false'
  NX_VERBOSE_LOGGING: 'true'
  NX_TASKS_RUNNER_DYNAMIC_OUTPUT: 'false'
jobs:
  cold:
    name: Cold producer
    if: github.repository == 'boringcache/nx-s3-cache-2gib-repro' && github.ref == 'refs/heads/boringcache-validation'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VALIDATION_PHASE: cold
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.2
      - name: Install GNU truncate on macOS
        if: runner.os == 'macOS'
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Isolate this cold seed
        run: sed -i.bak "s/v131-september-22/v131-september-22-$GITHUB_RUN_ID/" .boringcache.toml
      - name: Configure native Nx cache
        id: cache
        uses: boringcache/one@9ca311f9b247835b3cc87639321c79bac8018145 # v1.31.0
        with:
          mode: nx
          trust-policy: publish
          diagnostics: summary
          fail-on-cache-error: true
      - name: Build and verify both file sizes
        run: bash .github/boringcache-build.sh

      - name: Record cache measurements
        if: always()
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          RESTORE_DURATION_SECONDS: ${{ steps.cache.outputs.restore-duration-seconds }}
          RESTORE_TRANSFERRED_BYTES: ${{ steps.cache.outputs.restore-transferred-bytes }}
        run: |
          {
            printf 'cache_hit=%s\n' "$CACHE_HIT"
            printf 'restore_duration_seconds=%s\n' "$RESTORE_DURATION_SECONDS"
            printf 'restore_transferred_bytes=%s\n' "$RESTORE_TRANSFERRED_BYTES"
            du -sk .nx/cache 2>/dev/null || true
          } | tee "$RUNNER_TEMP/validation/cache-measurements.txt"

      - name: Retain native cache evidence
        if: always()
        env:
          EVIDENCE_PATH: ${{ steps.cache.outputs.evidence-path }}
        run: |
          if [[ -f "$EVIDENCE_PATH" ]]; then
            cp "$EVIDENCE_PATH" "$RUNNER_TEMP/validation/cache-evidence.json"
          fi
      - name: Retain file hashes and native cache evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nx-cold-${{ matrix.os }}
          path: ${{ runner.temp }}/validation
          retention-days: 14
  warm:
    needs: cold
    if: github.repository == 'boringcache/nx-s3-cache-2gib-repro' && github.ref == 'refs/heads/boringcache-validation'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      VALIDATION_PHASE: warm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.2
      - name: Install GNU truncate on macOS
        if: runner.os == 'macOS'
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Isolate this cold seed
        run: sed -i.bak "s/v131-september-22/v131-september-22-$GITHUB_RUN_ID/" .boringcache.toml
      - name: Configure native Nx cache
        id: cache
        uses: boringcache/one@9ca311f9b247835b3cc87639321c79bac8018145 # v1.31.0
        with:
          mode: nx
          trust-policy: restore
          diagnostics: summary
          fail-on-cache-error: true
      - name: Build and verify both file sizes
        run: bash .github/boringcache-build.sh

      - name: Record cache measurements
        if: always()
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          RESTORE_DURATION_SECONDS: ${{ steps.cache.outputs.restore-duration-seconds }}
          RESTORE_TRANSFERRED_BYTES: ${{ steps.cache.outputs.restore-transferred-bytes }}
        run: |
          {
            printf 'cache_hit=%s\n' "$CACHE_HIT"
            printf 'restore_duration_seconds=%s\n' "$RESTORE_DURATION_SECONDS"
            printf 'restore_transferred_bytes=%s\n' "$RESTORE_TRANSFERRED_BYTES"
            du -sk .nx/cache 2>/dev/null || true
          } | tee "$RUNNER_TEMP/validation/cache-measurements.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nx-cold-${{ matrix.os }}
          path: ${{ runner.temp }}/cold
      - name: Compare restored bytes with the cold producer
        run: |
          diff "$RUNNER_TEMP/cold/sha256.txt" "$RUNNER_TEMP/validation/sha256.txt"
          diff "$RUNNER_TEMP/cold/sizes.txt" "$RUNNER_TEMP/validation/sizes.txt"

      - name: Retain native cache evidence
        if: always()
        env:
          EVIDENCE_PATH: ${{ steps.cache.outputs.evidence-path }}
        run: |
          if [[ -f "$EVIDENCE_PATH" ]]; then
            cp "$EVIDENCE_PATH" "$RUNNER_TEMP/validation/cache-evidence.json"
          fi
      - name: Retain file hashes and native cache evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nx-warm-${{ matrix.os }}
          path: ${{ runner.temp }}/validation
          retention-days: 14
